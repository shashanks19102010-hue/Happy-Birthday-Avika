name: Build real Avika photo assets

on:
  push:
    branches: ["feature/god-level-avika-2"]
    paths-ignore:
      - "assets/avika-*.jpg"

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare photo files
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Split and optimize photos
        run: |
          python <<'PY'
          from io import BytesIO
          from pathlib import Path
          from PIL import Image

          src = Path("assets/memory-strip.webp")
          if not src.exists():
              raise SystemExit("assets/memory-strip.webp is missing")

          im = Image.open(src).convert("RGB")
          panels = 5
          w, h = im.size

          if w < panels * 100:
              raise SystemExit(f"Unexpected strip dimensions: {w}x{h}")

          out_dir = Path("assets")
          manifest = []

          def encoded(img, quality):
              buf = BytesIO()
              img.save(buf, format="JPEG", quality=quality, optimize=True, progressive=True, subsampling="4:2:0")
              return buf.getvalue()

          for i in range(panels):
              x0 = round(i * w / panels)
              x1 = round((i + 1) * w / panels)
              crop = im.crop((x0, 0, x1, h))

              target_w = 1200
              target_h = max(1, round(crop.height * target_w / crop.width))
              crop = crop.resize((target_w, target_h), Image.Resampling.LANCZOS)

              best = None
              for q in range(90, 39, -2):
                  data = encoded(crop, q)
                  if 100_000 <= len(data) <= 250_000:
                      best = data
                      break
                  if len(data) < 100_000:
                      best = data
                      break
              if best is None:
                  best = data

              # Prefer the 100–250 KB target; if tiny, use the highest quality result.
              if len(best) < 100_000:
                  for q in (95, 92, 90):
                      data = encoded(crop, q)
                      if len(data) > len(best) and len(data) <= 250_000:
                          best = data

              out = out_dir / f"avika-{i+1}.jpg"
              out.write_bytes(best)
              manifest.append({
                  "file": str(out),
                  "bytes": len(best),
                  "width": crop.width,
                  "height": crop.height
              })

          Path("assets/photo-manifest.json").write_text(__import__("json").dumps(manifest, indent=2) + "\n", encoding="utf-8")
          for item in manifest:
              print(item)
          PY

      - name: Commit photo assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/avika-*.jpg assets/photo-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "build: restore complete Avika photo assets [photo-build]"
          git push
